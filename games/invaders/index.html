<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Invaders</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            display: none;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
            color: #fff;
        }

        body.active {
            display: flex;
        }

        canvas {
            width: 320px;
            height: 288px;
            background: #080810;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <canvas id="game_canvas" width="320" height="288"></canvas>

    <script>
        
        // Constants

        const canvas = document.getElementById('game_canvas');
        const ctx = canvas.getContext('2d');
        const player = {
            x: 150,
            y: 255,
            w: 20,
            h: 10,
            speed: 8
        };
        const max_lasers = 3;
        const rows = 3;
        const cols = 7;

        // Variables

        let game_state = 'INACTIVE';
        let previous_state = 'TITLE';
        let animation_id;
        let last_time = 0;
        const target_fps = 60;
        const fps_interval = 1000 / target_fps;
        let score = 0;
        let wave = 1;
        let frame_count = 0;
        let lasers = [];
        let invaders = [];
        let invader_dir = 1;
        let invader_step_timer = 0;
        let invader_speed = 30;

        // Lifecycle

        function open_game() {
            document.body.classList.add('active');
            game_state = 'TITLE';
            reset_full_game();
            draw_title_screen();
        }

        function close_game() {
            document.body.classList.remove('active');
            game_state = 'INACTIVE';
            cancelAnimationFrame(animation_id);
            clear_canvas();
        }

        // Setup

        function init_invaders() {
            invaders = [];
            const inv_w = 16;
            const inv_h = 12;
            const start_x = 35;
            const start_y = 40;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    invaders.push({
                        x: start_x + c * (inv_w + 12),
                        y: start_y + r * (inv_h + 10),
                        w: inv_w,
                        h: inv_h,
                        type: r,
                        alive: true
                    });
                }
            }
            invader_dir = 1;
            invader_speed = Math.max(10, 35 - wave * 4);
        }

        function reset_full_game() {
            score = 0;
            wave = 1;
            player.x = 150;
            lasers = [];
            init_invaders();
        }

        // Game Loop

        function main(current_time) {
            if (game_state !== 'PLAYING') return;

            animation_id = requestAnimationFrame(main);

            if (!current_time) current_time = performance.now();
            let elapsed = current_time - last_time;

            if (elapsed > fps_interval) {
                last_time = current_time - (elapsed % fps_interval);

                clear_canvas();
                update_lasers();
                update_invaders();
                check_collisions();

                draw_stars();
                draw_invaders();
                draw_player();
                draw_lasers();
                draw_hud();

                frame_count++;
            }
        }

        // Draw & Updates

        function update_lasers() {
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].y -= 6;
                if (lasers[i].y < 0) lasers.splice(i, 1);
            }
        }

        function update_invaders() {
            invader_step_timer++;

            const alive_count = invaders.filter(i => i.alive).length;
            if (alive_count === 0) {
                trigger_next_wave();
                return;
            }

            const current_speed = Math.max(3, Math.floor(invader_speed * (alive_count / (rows * cols))));

            if (invader_step_timer >= current_speed) {
                invader_step_timer = 0;
                let shift_down = false;

                for (let inv of invaders) {
                    if (!inv.alive) continue;
                    if ((invader_dir === 1 && inv.x + inv.w >= canvas.width - 10) ||
                        (invader_dir === -1 && inv.x <= 10)) {
                        shift_down = true;
                        break;
                    }
                }

                if (shift_down) {
                    invader_dir *= -1;
                    for (let inv of invaders) {
                        if (!inv.alive) continue;
                        inv.y += 8;
                        if (inv.y + inv.h >= player.y) {
                            trigger_game_over();
                        }
                    }
                } else {
                    for (let inv of invaders) {
                        if (!inv.alive) continue;
                        inv.x += invader_dir * 6;
                    }
                }
            }
        }

        function check_collisions() {
            for (let l = lasers.length - 1; l >= 0; l--) {
                let laser = lasers[l];
                for (let inv of invaders) {
                    if (!inv.alive) continue;

                    if (laser.x > inv.x && laser.x < inv.x + inv.w &&
                        laser.y > inv.y && laser.y < inv.y + inv.h) {
                        
                        inv.alive = false;
                        lasers.splice(l, 1);
                        score += (3 - inv.type) * 10;
                        break;
                    }
                }
            }
        }

        function shoot_laser() {
            if (game_state !== 'PLAYING') return;
            if (lasers.length < max_lasers) {
                lasers.push({
                    x: player.x + player.w / 2,
                    y: player.y
                });
            }
        }

        function move_player(dir) {
            if (game_state !== 'PLAYING') return;
            player.x += dir * player.speed;
            if (player.x < 10) player.x = 10;
            if (player.x + player.w > canvas.width - 10) player.x = canvas.width - 10 - player.w;
        }

        function clear_canvas() {
            ctx.fillStyle = "#080810";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function draw_stars() {
            ctx.fillStyle = "#ffffff33";
            ctx.fillRect(40, 30, 2, 2);
            ctx.fillRect(280, 70, 2, 2);
            ctx.fillRect(100, 180, 1, 1);
            ctx.fillRect(220, 220, 2, 2);
        }

        function draw_player() {
            ctx.fillStyle = "#4dcbc2";
            ctx.fillRect(player.x, player.y + 4, player.w, player.h - 4);
            ctx.fillRect(player.x + 8, player.y, 4, 4);
        }

        function draw_lasers() {
            ctx.fillStyle = "#ff5555";
            lasers.forEach(l => ctx.fillRect(l.x - 1, l.y, 2, 6));
        }

        function draw_invaders() {
            const colors = ["#ff5555", "#ffcc00", "#4dcbc2"];
            invaders.forEach(inv => {
                if (!inv.alive) return;
                ctx.fillStyle = colors[inv.type % colors.length];
                ctx.fillRect(inv.x, inv.y, inv.w, inv.h);
                ctx.fillStyle = "#080810";
                ctx.fillRect(inv.x + 3, inv.y + 3, 3, 3);
                ctx.fillRect(inv.x + inv.w - 6, inv.y + 3, 3, 3);
            });
        }

        function draw_hud() {
            ctx.fillStyle = "#fff";
            ctx.font = "10px monospace";
            ctx.textAlign = "left";
            ctx.fillText("SCORE: " + score, 10, 18);
            ctx.textAlign = "right";
            ctx.fillText("WAVE " + wave, canvas.width - 10, 18);

            ctx.strokeStyle = "#222";
            ctx.beginPath();
            ctx.moveTo(0, 24);
            ctx.lineTo(canvas.width, 24);
            ctx.stroke();
        }

        function draw_title_screen() {
            if (game_state !== 'TITLE') return;
            clear_canvas();

            ctx.fillStyle = "#4dcbc2";
            ctx.font = "bold 16px monospace";
            ctx.textAlign = "center";
            ctx.fillText("Space Invaders", canvas.width / 2, 90);

            ctx.fillStyle = "#ff5555";
            ctx.font = "10px monospace";
            ctx.fillText("DEFEND THE GALAXY", canvas.width / 2, 115);

            if (Math.floor(Date.now() / 500) % 2 === 0) {
                ctx.fillStyle = "#ffcc00";
                ctx.font = "12px monospace";
                ctx.fillText("PRESS START / A", canvas.width / 2, 165);
            }

            ctx.fillStyle = "#aaa";
            ctx.font = "9px monospace";
            ctx.fillText("SELECT / S : CONTROLS", canvas.width / 2, 225);

            animation_id = requestAnimationFrame(draw_title_screen);
        }

        // State

        function start_game() {
            cancelAnimationFrame(animation_id);
            game_state = 'PLAYING';
            last_time = performance.now();
            main();
        }

        function trigger_next_wave() {
            wave++;
            lasers = [];
            init_invaders();
        }

        function pause_game() {
            if (game_state !== 'PLAYING') return;
            game_state = 'PAUSED';
            cancelAnimationFrame(animation_id);

            clear_canvas();
            ctx.fillStyle = "#ffcc00";
            ctx.font = "16px monospace";
            ctx.textAlign = "center";
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = "#fff";
            ctx.font = "10px monospace";
            ctx.fillText("Press Start to Resume", canvas.width / 2, canvas.height / 2 + 15);
        }

        function unpause_game() {
            if (game_state !== 'PAUSED') return;
            game_state = 'PLAYING';
            last_time = performance.now();
            main();
        }

        function toggle_controls() {
            if (game_state === 'CONTROLS') {
                game_state = previous_state;
                if (game_state === 'TITLE') draw_title_screen();
                else if (game_state === 'PLAYING') {
                    last_time = performance.now();
                    main();
                }
                return;
            }

            previous_state = game_state;
            game_state = 'CONTROLS';
            cancelAnimationFrame(animation_id);

            clear_canvas();
            ctx.fillStyle = "#4dcbc2";
            ctx.font = "bold 14px monospace";
            ctx.textAlign = "center";
            ctx.fillText("CONTROLS", canvas.width / 2, 35);

            ctx.fillStyle = "#fff";
            ctx.font = "10px monospace";
            ctx.textAlign = "center";
            ctx.fillText("D-PAD LEFT / RIGHT : Move Ship", canvas.width / 2, 85);
            ctx.fillText("A BUTTON : Shoot Laser", canvas.width / 2, 110);
            ctx.fillText("START : Start / Pause Game", canvas.width / 2, 135);
            ctx.fillText("SELECT : Controls Menu", canvas.width / 2, 160);

            ctx.fillStyle = "#ffcc00";
            ctx.font = "10px monospace";
            ctx.fillText("PRESS SELECT / S TO RETURN", canvas.width / 2, 225);
        }

        function trigger_game_over() {
            game_state = 'GAMEOVER';
            cancelAnimationFrame(animation_id);

            clear_canvas();
            ctx.fillStyle = "#ff5555";
            ctx.font = "18px monospace";
            ctx.textAlign = "center";
            ctx.fillText("SYSTEM FAILURE", canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = "#fff";
            ctx.font = "12px monospace";
            ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 5);

            ctx.font = "10px monospace";
            ctx.fillText("Press A / Start to Restart", canvas.width / 2, canvas.height / 2 + 30);
        }

        function handle_input_action(action) {
            if (game_state === 'INACTIVE') return;

            if (action === 'move_left') move_player(-1);
            if (action === 'move_right') move_player(1);

            if (action === 'action_a') {
                if (game_state === 'TITLE' || game_state === 'GAMEOVER') {
                    reset_full_game();
                    start_game();
                } else if (game_state === 'PLAYING') {
                    shoot_laser();
                }
            }

            if (action === 'start_btn') {
                if (game_state === 'TITLE' || game_state === 'GAMEOVER') {
                    reset_full_game();
                    start_game();
                } else if (game_state === 'PLAYING') {
                    pause_game();
                } else if (game_state === 'PAUSED') {
                    unpause_game();
                }
            }

            if (action === 'select_btn') toggle_controls();
        }

        // Listeners

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') handle_input_action('move_left');
            if (e.key === 'ArrowRight') handle_input_action('move_right');
            if (e.key === 'a' || e.key === 'A' || e.code === 'Space') handle_input_action('action_a');
            if (e.key === 'Enter' || e.key === 'p' || e.key === 'P') handle_input_action('start_btn');
            if (e.key === 's' || e.key === 'S') handle_input_action('select_btn');
        });

        window.addEventListener('message', (e) => {
            if (!e.data) return;

            if (e.data.type === 'handheld:open') open_game();
            if (e.data.type === 'handheld:close') close_game();

            if (e.data.type === 'handheld:input') {
                const btn = e.data.button;
                if (btn === 'dpad_left') handle_input_action('move_left');
                if (btn === 'dpad_right') handle_input_action('move_right');
                if (btn === 'a' || btn === 'dpad_up') handle_input_action('action_a');
                if (btn === 'start' || btn === 'pause') handle_input_action('start_btn');
                if (btn === 'select') handle_input_action('select_btn');
            }
        });
    </script>
</body>
</html>
